# 页面和 /api 都由这一个服务提供。外面的 Nginx 反代到 8080 即可。
services:
  weicopy:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - weicopy-data:/app/data
      - weicopy-uploads:/app/uploads
    environment:
      GIN_MODE: release
      MAX_UPLOAD_SIZE_MB: "50"

volumes:
  weicopy-data:
  weicopy-uploads:
